name: resume_builder
description: "Resume Builder - offline CV, cover letter & proposal maker with PDF export"
publish_to: 'none'
version: 1.0.0+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  pdf: ^3.10.8
  printing: ^5.12.0
  shared_preferences: ^2.2.2
  http: ^1.2.0
  google_fonts: ^6.1.0
  uuid: ^4.3.3
  file_picker: ^11.0.2
  read_pdf_text: ^0.3.1
  image_picker: ^1.1.2
  screen_protector: ^1.5.3
  google_mlkit_translation: ^0.14.0
  purchases_flutter: ^10.8.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icon/icon_master.png
  # UI fonts bundled locally (variable TTFs — Flutter selects the weight along
  # the wght axis) so text renders instantly and offline. Previously these
  # came from google_fonts' runtime fetching, which stalled the first frame
  # on slow networks.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
