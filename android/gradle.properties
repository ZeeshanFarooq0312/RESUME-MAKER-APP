org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# AGP is pinned below 9.0 (see settings.gradle.kts) because not all plugins in
# use yet support AGP 9's built-in Kotlin migration, so built-in Kotlin stays off
# and the classic Kotlin Gradle Plugin (applied in app/build.gradle.kts) compiles instead.
android.builtInKotlin=false
# Disabled: Kotlin's incremental compiler computes relative paths between the
# pub cache (C:) and this project (D:), which throws on Windows when the two
# paths don't share a drive root, corrupting the incremental cache.
kotlin.incremental=false
